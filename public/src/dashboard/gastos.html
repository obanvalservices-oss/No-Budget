<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f1419" />
  <title>Expenses — No Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/dashboard-shell.css" />
  <link rel="stylesheet" href="/src/css/gastos.css" />
</head>
<body class="dashboard-body module-gastos">
  <header class="header">
    <div class="header-brand">
      <a href="home.html" class="brand-mark" aria-label="No Budget — Dashboard">
        <img class="brand-logo" src="/assets/logo_budget.png" alt="" width="32" height="32" decoding="async" />
        <span class="brand-text">No Budget</span>
      </a>
    </div>
    <nav class="menu" aria-label="Modules">
      <ul>
        <li><a href="home.html" class="nav-link" data-nav="home">Dashboard</a></li>
        <li><a href="ingresos.html" class="nav-link" data-nav="ingresos">Income</a></li>
        <li><a href="gastos.html" class="nav-link active" data-nav="gastos">Expenses</a></li>
        <li><a href="deudas.html" class="nav-link" data-nav="deudas">Debts</a></li>
        <li><a href="ahorros.html" class="nav-link" data-nav="ahorros">Savings</a></li>
        <li><a href="inversiones.html" class="nav-link" data-nav="inversiones">Investments</a></li>
        <li><a href="compartido.html" class="nav-link" data-nav="compartido">Shared</a></li>
        <li><a href="settings.html" class="nav-link" data-nav="settings">Settings</a></li>
        <li><button type="button" class="btn-logout" data-action="logout" aria-label="Log out">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="form-section">
      <h2 class="nb-section-title">Record expense</h2>
      <form id="gastosForm">
        <label for="descripcionGasto">Description</label>
        <input type="text" id="descripcionGasto" required />

        <div class="nb-categoria-field">
          <label for="categoriaGasto">Category</label>
          <select id="categoriaGasto" data-modulo="GASTOS" required aria-describedby="categoriaGastoHint">
            <option value="">Select category</option>
          </select>
          <p id="categoriaGastoHint" class="nb-categoria-hint">
            Expenses use system category IDs. You can create a new one and it will be selected when saved.
          </p>
          <input
            type="text"
            id="nuevaCategoriaInput"
            class="nb-categoria-nueva"
            placeholder="New category name"
            autocomplete="off"
            aria-label="New category name"
          />
        </div>

        <label for="montoGasto">Amount ($)</label>
        <input type="number" id="montoGasto" step="0.01" min="0.01" required />

        <label for="frecuenciaGasto">Frequency</label>
        <select id="frecuenciaGasto" required>
          <option value="">Select</option>
          <option value="una_vez">Once</option>
          <option value="semanal">Weekly</option>
          <option value="mensual">Monthly</option>
        </select>

        <label for="fechaPagoGasto">Payment date</label>
        <input type="date" id="fechaPagoGasto" required />

        <label for="origenGasto">Source of funds</label>
        <select id="origenGasto" required>
          <option value="">Select source</option>
          <option value="Banco">Banco</option>
          <option value="Savings fund">Savings fund</option>
          <option value="Fixed income">Fixed income</option>
        </select>

        <div class="checkbox-row">
          <input type="checkbox" id="fijoGasto" />
          <label for="fijoGasto">Is this a fixed expense?</label>
        </div>

        <button type="submit" class="btn-rojo">Save expense</button>
      </form>
    </section>

    <section class="historial-section">
      <h2 class="nb-section-title">Expense history</h2>
      <div id="historialGastos" class="historial-lista">
        <!-- Expenses rendered dynamically -->
      </div>
    </section>
  </main>

  <div id="modalEditarGasto" class="modal-editar" style="display: none" aria-hidden="true">
    <div class="modal-contenido">
      <h3>Edit expense</h3>
      <form id="formEditarGasto">
        <input type="hidden" id="editGastoId" />
        <label for="editDescGasto">Description</label>
        <input type="text" id="editDescGasto" required />
        <label for="editMontoGasto">Amount ($)</label>
        <input type="number" id="editMontoGasto" step="0.01" min="0.01" required />
        <label for="editCatGasto">Category</label>
        <select id="editCatGasto" required></select>
        <label for="editFrecGasto">Frequency</label>
        <select id="editFrecGasto" required>
          <option value="una_vez">Once</option>
          <option value="semanal">Weekly</option>
          <option value="mensual">Monthly</option>
        </select>
        <label for="editFechaGasto">Payment date</label>
        <input type="date" id="editFechaGasto" required />
        <label for="editOrigenGasto">Source</label>
        <select id="editOrigenGasto" required>
          <option value="Banco">Banco</option>
          <option value="Savings fund">Savings fund</option>
          <option value="Fixed income">Fixed income</option>
        </select>
        <label class="chk-wrap"><input type="checkbox" id="editFijoGasto" /> Fixed expense</label>
        <div class="botones-modal">
          <button type="submit" class="btn-rojo">Save changes</button>
          <button type="button" id="btnCancelEditGasto" class="btn-cancelar">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 No Budget</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/src/js/auth.js"></script>
  <script src="/src/js/nb-historial.js"></script>
  <script src="/src/js/gastos.js"></script>
</body>
</html>
