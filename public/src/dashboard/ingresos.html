<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f1419" />
  <title>Income — No Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/dashboard-shell.css" />
  <link rel="stylesheet" href="/src/css/ingresos.css" />
</head>
<body class="dashboard-body module-ingresos">
  <header class="header">
    <div class="header-brand">
      <a href="home.html" class="brand-mark" aria-label="No Budget — Dashboard">
        <img class="brand-logo" src="/assets/logo_budget.png" alt="" width="32" height="32" decoding="async" />
        <span class="brand-text">No Budget</span>
      </a>
    </div>
    <nav class="menu" aria-label="Modules">
      <ul>
        <li><a href="home.html" class="nav-link" data-nav="home">Dashboard</a></li>
        <li><a href="ingresos.html" class="nav-link active" data-nav="ingresos">Income</a></li>
        <li><a href="gastos.html" class="nav-link" data-nav="gastos">Expenses</a></li>
        <li><a href="deudas.html" class="nav-link" data-nav="deudas">Debts</a></li>
        <li><a href="ahorros.html" class="nav-link" data-nav="ahorros">Savings</a></li>
        <li><a href="inversiones.html" class="nav-link" data-nav="inversiones">Investments</a></li>
        <li><a href="compartido.html" class="nav-link" data-nav="compartido">Shared</a></li>
        <li><a href="settings.html" class="nav-link" data-nav="settings">Settings</a></li>
        <li><button type="button" class="btn-logout" data-action="logout" aria-label="Log out">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main class="contenedor-ingresos">
    <section class="formulario-ingreso">
      <h2 class="nb-section-title">Record income</h2>
      <form id="formIngreso">
        <label for="fuente">Income source</label>
        <input type="text" id="fuente" placeholder="e.g. Salary, Sale" required />

        <label for="montoIngreso">Amount ($)</label>
        <input type="number" id="montoIngreso" step="0.01" min="0.01" required />

        <label for="frecuenciaIngreso">Frequency</label>
        <select id="frecuenciaIngreso" required>
          <option value="">Select</option>
          <option value="Único">One-time</option>
          <option value="Semanal">Weekly</option>
          <option value="Quincenal">Biweekly</option>
          <option value="Monthly">Monthly</option>
          <option value="Otro">Other</option>
        </select>

        <label for="fechaIngreso">Date</label>
        <input type="date" id="fechaIngreso" required />

        <label>
          <input type="checkbox" id="fijoIngreso" />
          Fixed income?
        </label>

        <div class="nb-categoria-field">
          <label for="categoriaIngreso">Category</label>
          <select id="categoriaIngreso" data-modulo="INGRESOS" required aria-describedby="categoriaIngresoHint">
            <option value="">Select a category</option>
          </select>
          <p id="categoriaIngresoHint" class="nb-categoria-hint">
            Group your income (salary, freelance, investments, etc.). You can add a new category when needed.
          </p>
          <input
            type="text"
            id="nuevaCategoriaInput"
            class="nb-categoria-nueva"
            placeholder="New category name"
            autocomplete="off"
            aria-label="New category name"
          />
        </div>

        <button type="submit" class="btn-guardar">Save income</button>
      </form>
    </section>

    <section class="lista-ingresos">
      <h2 class="nb-section-title">Income list</h2>
      <div id="listaIngresos">
        <!-- Income rendered dynamically -->
      </div>
    </section>
  </main>

  <div id="modalEditarIngreso" class="modal-editar" style="display: none" aria-hidden="true">
    <div class="modal-contenido">
      <h3>Edit income</h3>
      <form id="formEditarIngreso">
        <input type="hidden" id="editIngresoId" />
        <label for="editSourceIng">Source</label>
        <input type="text" id="editSourceIng" required />
        <label for="editMontoIng">Amount ($)</label>
        <input type="number" id="editMontoIng" step="0.01" min="0.01" required />
        <label for="editFrequencyIng">Frequency</label>
        <select id="editFrequencyIng" required>
          <option value="Único">One-time</option>
          <option value="Semanal">Weekly</option>
          <option value="Quincenal">Biweekly</option>
          <option value="Monthly">Monthly</option>
          <option value="Otro">Other</option>
        </select>
        <label for="editFechaIng">Date</label>
        <input type="date" id="editFechaIng" required />
        <label class="chk-wrap"><input type="checkbox" id="editFijoIng" /> Fixed income</label>
        <label for="editCategoriaIngreso">Category</label>
        <select id="editCategoriaIngreso" required></select>
        <div class="botones-modal">
          <button type="submit" class="btn-guardar">Save changes</button>
          <button type="button" id="btnCancelEditIngreso" class="btn-cancelar">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 No Budget</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/src/js/auth.js"></script>
  <script src="/src/js/nb-historial.js"></script>
  <script src="/src/js/ingresos.js"></script>
</body>
</html>
