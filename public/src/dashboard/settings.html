<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1419" />
  <title>Settings — No Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/dashboard-shell.css" />
  <link rel="stylesheet" href="/src/css/settings.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="dashboard-body module-settings">
  <header class="header">
    <div class="header-brand">
      <a href="home.html" class="brand-mark" aria-label="No Budget — Dashboard">
        <img class="brand-logo" src="/assets/logo_budget.png" alt="" width="32" height="32" decoding="async" />
        <span class="brand-text">No Budget</span>
      </a>
    </div>
    <nav class="menu" aria-label="Modules">
      <ul>
        <li><a href="home.html" class="nav-link" data-nav="home">Dashboard</a></li>
        <li><a href="ingresos.html" class="nav-link" data-nav="ingresos">Income</a></li>
        <li><a href="gastos.html" class="nav-link" data-nav="gastos">Expenses</a></li>
        <li><a href="deudas.html" class="nav-link" data-nav="deudas">Debts</a></li>
        <li><a href="ahorros.html" class="nav-link" data-nav="ahorros">Savings</a></li>
        <li><a href="inversiones.html" class="nav-link" data-nav="inversiones">Investments</a></li>
        <li><a href="compartido.html" class="nav-link" data-nav="compartido">Shared</a></li>
        <li><a href="settings.html" class="nav-link active" data-nav="settings">Settings</a></li>
        <li><button type="button" class="btn-logout" data-action="logout" aria-label="Log out">Log out</button></li>
      </ul>
    </nav>
  </header>

  <main class="config-container">
    <h2 class="nb-section-title">Account settings</h2>

    <!-- Estado actual visible -->
    <section class="config-box" id="estadoActualBox">
      <h3>📌 Current status</h3>
      <div id="estadoActual" class="estado-actual">
        <!-- Se rellena en settings.js -->
      </div>
    </section>

    <!-- Preferencias de semana -->
    <section class="config-box">
      <h3>📅 Week preferences</h3>
      <form id="formSemana">
        <label for="weekStartDay">Start day:</label>
        <select id="weekStartDay" name="weekStartDay">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>

        <label for="weekEndDay">End day:</label>
        <select id="weekEndDay" name="weekEndDay">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>
        <button type="submit">Save</button>
      </form>
    </section>

    <!-- Preferencias generales -->
    <section class="config-box">
      <h3>🌍 General preferences</h3>
      <form id="formGeneral">
        <label for="currency">Currency:</label>
        <select id="currency" name="currency">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="MXN">MXN (₱)</option>
          <option value="COP">COP ($)</option>
          <option value="ARS">ARS ($)</option>
          <option value="CLP">CLP ($)</option>
          <option value="PEN">PEN (S/)</option>
        </select>

        <label for="timezone">Time zone:</label>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;">
          <select id="timezone" name="timezone"></select>
          <button type="button" id="btnDetectTZ" title="Auto-detect">Detect</button>
        </div>

        <label style="margin-top:.75rem;">
          <input type="checkbox" id="notifications" />
          Receive notifications
        </label>

        <button type="submit">Save</button>
      </form>
      <small id="tzHint" style="color:#666;display:block;margin-top:.5rem;"></small>
    </section>

    <!-- Seguridad -->
    <section class="config-box">
      <h3>🔒 Security</h3>
      <form id="formPassword">
        <label for="currentPassword">Password actual:</label>
        <input type="password" id="currentPassword" required />

        <label for="newPassword">New password:</label>
        <input type="password" id="newPassword" required minlength="6" />

        <button type="submit">Update password</button>
      </form>
      <small style="color:#666;display:block;margin-top:.5rem;">Password must be at least 6 characters.</small>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 No Budget</p>
  </footer>

  <script src="/src/js/auth.js"></script>
  <script src="/src/js/settings.js"></script>
</body>
</html>
