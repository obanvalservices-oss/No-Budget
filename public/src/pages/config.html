<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — No Budget</title>
  <link rel="stylesheet" href="/src/css/home.css" />
</head>
<body>
  <header class="header">
    <h1>No Budget</h1>
    <nav class="menu">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="ingresos.html">Income</a></li>
        <li><a href="gastos.html">Expenses</a></li>
        <li><a href="ahorros.html">Savings</a></li>
        <li><a href="inversiones.html">Investments</a></li>
        <li><a href="compartido.html">Shared</a></li>
        <li><a href="config.html" class="active">Settings</a></li>
      </ul>
    </nav>
  </header>

  <main class="dashboard-container" style="max-width:1080px;margin:0 auto;gap:1rem;">
    <!-- Estado actual -->
    <section class="resumen-box" id="estadoActualBox" style="width:100%;">
      <h2 class="resumen-title">Your account status</h2>
      <div class="resumen-item">
        <span>Accounting week:</span>
        <strong id="stateWeekText">—</strong>
      </div>
      <div class="resumen-item">
        <span>Time zone:</span>
        <strong id="stateTzText">—</strong>
      </div>
      <div class="resumen-item">
        <span>Currency:</span>
        <strong id="stateCurrencyText">—</strong>
      </div>
    </section>

    <!-- Configurar semana -->
    <section class="resumen-box" style="width:100%;">
      <h2 class="resumen-title">Set week start and end</h2>
      <div class="resumen-item" style="border:0;padding:0.25rem 0;">
        <label for="weekStartSelect" style="min-width:160px;">Start day</label>
        <select id="weekStartSelect">
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
          <option value="7">Sunday</option>
        </select>
      </div>
      <div class="resumen-item" style="border:0;padding:0.25rem 0;">
        <label for="weekEndSelect" style="min-width:160px;">End day</label>
        <select id="weekEndSelect">
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
          <option value="7">Sunday</option>
        </select>
      </div>
      <div class="resumen-item" style="border:0;padding:.5rem 0;">
        <button id="btnSaveWeek" class="btn-guardar">Save</button>
      </div>
      <small style="color:#777;">Tip: if the week starts on Saturday, the typical end is Friday.</small>
    </section>

    <!-- Time zone and currency (opcional ahora) -->
    <section class="resumen-box" style="width:100%;">
      <h2 class="resumen-title">Time zone and currency</h2>
      <div class="resumen-item" style="border:0;padding:0.25rem 0;">
        <label for="tzSelect" style="min-width:160px;">Zona horaria</label>
        <input id="tzSelect" type="text" placeholder="Ej: America/New_York" />
      </div>
      <div class="resumen-item" style="border:0;padding:0.25rem 0;">
        <label for="currencySelect" style="min-width:160px;">Moneda</label>
        <input id="currencySelect" type="text" placeholder="USD, EUR, etc." />
      </div>
      <div class="resumen-item" style="border:0;padding:.5rem 0;">
        <button id="btnSavePrefs" class="btn-guardar">Save</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 No Budget</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/src/js/auth.js"></script>
  <script src="/src/js/settings.js"></script>
</body>
</html>
